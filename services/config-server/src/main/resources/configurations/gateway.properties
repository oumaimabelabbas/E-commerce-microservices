
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.server.webmvc.routes[0].id=customer-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://CUSTOMER
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/customers/**

spring.cloud.gateway.server.webmvc.routes[1].id=order-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://ORDER
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/orders/**


spring.cloud.gateway.server.webmvc.routes[2].id=orderline-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://ORDER
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/order-lines/**

spring.cloud.gateway.server.webmvc.routes[3].id=product-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://PRODUCT
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/products/**

